name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:  # Manual trigger
    inputs:
      deploy:
        description: 'Deploy to the droplet'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .next/standalone
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    env:
      APP_DIR: /var/www/kailanasommer
      TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: standalone
          path: standalone

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust droplet host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Ship the build
        run: |
          ssh -T "$TARGET" "mkdir -p $APP_DIR"
          rsync -az --delete --exclude '.env' standalone/ "$TARGET:$APP_DIR/"

      - name: Write env and restart
        run: |
          ssh -T "$TARGET" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /var/www/kailanasommer

          cat > .env <<ENV
          PORT=3001
          HOSTNAME=127.0.0.1
          X_API_KEY=${{ secrets.X_API_KEY }}
          X_API_HOST=${{ secrets.X_API_HOST }}
          ENV
          chmod 600 .env

          pm2 restart kailanasommer \
            || pm2 start server.js --name kailanasommer --node-args="--env-file=.env" --max-memory-restart 200M
          pm2 save

          echo "✅ Deployment complete"
          EOF
